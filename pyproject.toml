[project]
name = "devforge-doom-template"
version = "0.1.0"
description = "Starter template for DevForge 'Can It Play DOOM?' (Yugaantar 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "doom-env",
    "vizdoom==1.3.3",
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# Team Slay: training + agent deps. torch pinned to the official image version (docker/requirements.lock).
train = [
    "torch==2.15.0",
    "tensorboard==2.21.0",
    "matplotlib>=3.9",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
]

[tool.uv]
# A plain `uv sync` installs torch too, so `uv run python validate.py` works on a fresh clone.
default-groups = ["dev", "train"]

[tool.uv.sources]
doom-env = { path = "env", editable = true }
# CUDA wheels (Blackwell RTX 50xx needs CUDA >= 12.8). Linux PyPI wheels already bundle CUDA.
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
